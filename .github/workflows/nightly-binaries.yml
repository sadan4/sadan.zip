name: Nightly Rust Binaries

on:
  push:
    branches:
      - web

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binaries
        run: >
          cargo build --release --target ${{ matrix.target }}
          -p reporter -p explorer_server

      - name: Prepare release files
        shell: bash
        run: |
          mkdir -p release
          cp "target/${{ matrix.target }}/release/reporter${{ matrix.ext }}" "release/reporter-${{ matrix.target }}${{ matrix.ext }}"
          cp "target/${{ matrix.target }}/release/explorer_server${{ matrix.ext }}" "release/explorer_server-${{ matrix.target }}${{ matrix.ext }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: release/*
          if-no-files-found: error

  release:
    name: Publish nightly release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: binaries-*
          merge-multiple: true

      - name: Publish or update nightly release
        uses: ncipollo/release-action@v1
        with:
          tag: nightly
          name: Nightly
          prerelease: true
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          makeLatest: false
          artifacts: release-assets/*
