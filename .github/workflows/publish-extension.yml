name: Publish VSCode Extension

# Dispatch-only, and deliberately NOT triggered by the tag push itself.
# A tag-triggered run executes on `refs/tags/vX.Y.Z`, and GitHub scopes the
# Actions cache to the run's own ref plus the default branch. Every tag is a
# fresh ref, so each release re-cached ~600MB per leg that no later run could
# ever read, while evicting the caches `web` actually reuses. Dispatching from
# `web` keeps the run on the default branch ref, so consecutive releases share
# one cache scope; the tag to publish is checked out explicitly below.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v2.0.2)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ inputs.tag }} (${{ matrix.vscodeTarget }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # Do not cancel other platforms if one fails; a partial publish is
      # recoverable by re-running the failed matrix leg.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            vscodeTarget: linux-x64
          - os: ubuntu-24.04-arm
            vscodeTarget: linux-arm64
          - os: windows-latest
            vscodeTarget: win32-x64
          - os: windows-11-arm
            vscodeTarget: win32-arm64
          - os: macos-14
            vscodeTarget: darwin-arm64

    steps:
      # Dispatching from any other ref puts the run in a throwaway cache scope
      # and silently reintroduces the cold-cache problem, so fail loudly.
      - name: Require dispatch from the default branch
        shell: bash
        run: |
          if [ "$GITHUB_REF" != "refs/heads/${{ github.event.repository.default_branch }}" ]; then
            echo "Run this workflow from the ${{ github.event.repository.default_branch }} branch, not $GITHUB_REF." >&2
            echo "The tag to publish is the 'tag' input; the branch only selects the cache scope." >&2
            exit 1
          fi

      # The workflow definition comes from the default branch; the sources come
      # from the tag being published.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.vscodeTarget }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cross-compiles companion_lsp to the target triple, stages it into the
      # extension's bin/, bundles the client, and produces a platform-specific
      # .vsix (vsce package --target). Each matrix leg runs on a native runner
      # so the target triple matches the host and no cross-toolchain is needed.
      - name: Package platform-specific VSIX
        run: cargo xtask package extension --target ${{ matrix.vscodeTarget }}

      - name: Resolve vsix path
        id: vsix
        shell: bash
        run: |
          vsix="$(ls packages/VencordCompanion/*.vsix | head -n1)"
          if [ -z "$vsix" ]; then
            echo "No .vsix produced" >&2
            exit 1
          fi
          echo "path=$vsix" >> "$GITHUB_OUTPUT"

      # The .vsix already encodes its target platform, and both vsce and ovsx
      # reject/ignore an explicit --target alongside --packagePath.
      - name: Publish to Visual Studio Marketplace
        run: >
          pnpm --filter vencord-user-companion exec
          vsce publish --no-dependencies
          --packagePath "${{ github.workspace }}/${{ steps.vsix.outputs.path }}"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        run: >
          pnpm --filter vencord-user-companion exec
          ovsx publish
          --packagePath "${{ github.workspace }}/${{ steps.vsix.outputs.path }}"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
