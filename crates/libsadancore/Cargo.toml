[package]
edition = "2024"
name    = "libsadancore"
publish = false
version = "0.0.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow.workspace                   = true
ast_parser.workspace               = true
async-trait.workspace              = true
console_error_panic_hook.workspace = true
const_format.workspace             = true
dagre.workspace                    = true
explorer_types.workspace           = true
js-sys.workspace                   = true
lightningcss.workspace             = true
memchr.workspace                   = true
oxc.workspace                      = true
parser_diag.workspace              = true
pretty_printer.workspace           = true
regress.workspace                  = true
rmp-serde.workspace                = true
rustc-hash.workspace               = true
serde.workspace                    = true
serde-wasm-bindgen.workspace       = true
serde_json.workspace               = true
smol_str.workspace                 = true
thiserror.workspace                = true
url.workspace                      = true
vencord_ast_parser.workspace       = true
wasm-bindgen.workspace             = true
wasm-bindgen-futures.workspace     = true
webpack_ast_parser.workspace       = true
zstd.workspace                     = true
# lightningcss pulls getrandom 0.3, which needs a backend on wasm32
getrandom.workspace = true

[features]
local-server = []

[dependencies.web-sys]
features  = ["CanvasRenderingContext2d", "HtmlCanvasElement", "Document", "Window", "Element", "CssStyleDeclaration", "Request", "Response", "WorkerGlobalScope"]
workspace = true

[lints]
workspace = true

[package.metadata.wasm-pack.profile.dev]
# doesn't work with dwarf debug info
wasm-opt = false

[package.metadata.wasm-pack.profile.dev.wasm-bindgen]
# Should we enable wasm-bindgen's debug assertions in its generated JS glue?
debug-js-glue = true
# Should wasm-bindgen demangle the symbols in the "name" custom section?
demangle-name-section = true
# # Should we emit the DWARF debug info custom sections?
dwarf-debug-info = true
# Should we omit the default import path?
omit-default-module-path = false

[package.metadata.wasm-pack.profile.profiling]
wasm-opt = ["-O4", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O4", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
