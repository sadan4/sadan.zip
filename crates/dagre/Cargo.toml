[package]
description       = "Rust port of dagre: directed graph layout"
edition.workspace = true
license           = "MIT"
name              = "dagre"
version           = "0.1.0"

[dependencies]
rustc-hash.workspace = true
serde                = { workspace = true, optional = true }
smol_str.workspace   = true

[features]
default = ["serde"]
profile = []
serde   = ["dep:serde"]

[dev-dependencies]
criterion.workspace  = true
serde_json.workspace = true

[[bench]]
harness = false
name    = "ranker_layout"

[lints]
workspace = true
