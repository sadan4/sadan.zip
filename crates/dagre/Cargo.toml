[package]
name = "dagre"
version = "0.1.0"
edition = "2021"
description = "Rust port of dagre: directed graph layout"
license = "MIT"

[lib]

[dependencies]
serde = { workspace = true, optional = true }

[features]
default = ["serde"]
serde = ["dep:serde"]
profile = []

[dev-dependencies]
criterion.workspace = true
serde_json.workspace = true

[[bench]]
name = "ranker_layout"
harness = false

[lints]
workspace = true