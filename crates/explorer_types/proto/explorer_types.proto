syntax = "proto3";

package explorer_types;
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

message BundleMetadata {
  // the raw bytes of the build hash, NOT its hex representation
  bytes                     build_hash   = 1;
  uint32                    build_number = 2;
  google.protobuf.Timestamp first_seen   = 3;
  optional uint32           entry_point  = 4;

  // moved to `FullBundle`
  reserved 5;
  reserved "env_var_text";
}

message ExportName {
  oneof kind {
    google.protobuf.Empty default_export = 1;
    string                named          = 2;
  }
}

message FluxDispatcherEntry {
  uint32     module_id   = 1;
  ExportName export_name = 2;
}

message KeyModules {
  repeated FluxDispatcherEntry flux_dispatcher_class = 1;
}

message IncomingModuleDeps {
  repeated uint32 sync = 1;
  repeated uint32 lazy = 2;
}

message DepInfo {
  KeyModules                      key_modules = 1;
  map<uint32, IncomingModuleDeps> module_deps = 2;
}

message ModuleIdList {
  repeated uint32 ids = 1;
}

message FullBundle {
  BundleMetadata      metadata       = 1;
  DepInfo             dep_info       = 2;
  ModuleSources       module_sources = 3;
  map<uint32, string> modules        = 4;
  string              env_var_text   = 5;
}

// each entry is an independently zstd-compressed, protobuf-serialized
// [`BundleMetadata`], matching the on-disk meta.pb.zst layout
message BuildList {
  repeated bytes builds = 1;
}

message TimestampQueryResults {
  optional BundleMetadata before = 1;
  optional BundleMetadata after  = 2;
}

message Span {
  uint32 start = 1;
  uint32 end   = 2;
}

message SpannedId {
  uint32 id   = 1;
  Span   span = 2;
}

// Information about a module's dependencies with source locations
message OutgoingModuleDepsWithLocs {
	// The modules that this module requires synchronously
  repeated SpannedId sync = 1;
	// the modules that this module requires lazily (dynamic import)
  repeated SpannedId lazy = 2;
}

message ModuleSources {
  map<string, ModuleIdList> sources = 1;
}

message BuildHashQuery {
  bytes build_hash = 1;
}

message Bundle7zArchive {
  bytes archive_7z = 1;
}

message GitHash {
  string hash = 1;
}

service BuildArchive {
  rpc GetBuildMetadata(BuildHashQuery) returns (BundleMetadata);
  rpc GetBuildArchive(BuildHashQuery) returns (FullBundle);
  rpc GetBundle7zArchive(BuildHashQuery) returns (Bundle7zArchive);
  rpc ListBuilds (google.protobuf.Empty) returns (stream BundleMetadata);
  rpc GetBuildsBeforeTimestamp(google.protobuf.Timestamp) returns (TimestampQueryResults);
  rpc GetBuildsBeforeHash(BuildHashQuery) returns (TimestampQueryResults);
  rpc GetLatestBuild(google.protobuf.Empty) returns (BundleMetadata);
  rpc FixupTimestamps(google.protobuf.Empty) returns (google.protobuf.Empty);
  rpc Version(google.protobuf.Empty) returns (GitHash);
}
