[package]
name = "bot"
version = "0.1.0"
edition.workspace = true

[dependencies]
anyhow.workspace = true
serenity = {workspace = true, features = ["default"]}
# serenity 0.12 is built against reqwest 0.12 and enables its `rustls-tls`
# feature, which was removed in reqwest 0.13. Pin a local 0.12 so cargo does
# not unify serenity onto the workspace's 0.13.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio-scoped.workspace = true
strum.workspace = true
futures-core.workspace = true
clap.workspace = true
bitflags.workspace = true
macros.workspace = true
shlex.workspace = true
itertools.workspace = true
derive_more.workspace = true
bot_config.workspace = true
serde_json.workspace = true
explorer_types.workspace = true
discord_scraper.workspace = true
smol_str.workspace = true
reporter.workspace = true
explorer_server_core.workspace = true
reqwest-middleware.workspace = true
async-scoped.workspace = true
memchr.workspace = true
rayon.workspace = true
oxc-miette.workspace = true
strip-ansi-escapes.workspace = true
git2.workspace = true
qalc.workspace = true
cxx.workspace = true
git_hash.workspace = true
demangler.workspace = true
zxcvbn.workspace = true
yaml_serde.workspace = true

[lints]
workspace = true
