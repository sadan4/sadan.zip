packages:
  - "packages/*"

allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  '@vscode/vsce-sign': false
  core-js: false
  esbuild: false
  keytar: false
  sharp: false
  workerd: false

ignoredBuiltDependencies:
  - core-js

patchedDependencies:
  '@tanstack/start-plugin-core': patches/@tanstack__start-plugin-core.patch
  eslint-plugin-react-x: patches/eslint-plugin-react-x.patch
  typescript: patches/typescript.patch
  vite: patches/vite.patch

verifyDepsBeforeRun: install

catalog:
  typescript: ^5.8.3
  vitest: ^4.1.11
  "@vitest/ui": ^4.1.11
  zod: ^4.3.6
  "@types/node": ^26.2.0
  # the root also pulls rolldown in through vite; one catalog entry keeps a
  # single copy in the lockfile
  rolldown: ^1.2.4
  rolldown-plugin-dts: ^0.28.2
