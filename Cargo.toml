[workspace]
members         = ["crates/*"]
package.edition = "2024"
resolver        = "3"

[workspace.metadata.cargo-shear]
# oxc_span is only pulled in for its "serialize" feature, which adds
# `Serialize` impls to `oxc::span::Span` (re-exported by `oxc`). It's
# never imported by name, so cargo-shear can't see the usage.
ignored = ["oxc_span"]

[workspace.dependencies]
anyhow                   = "1"
arrayvec                 = "0.7"
async-trait              = "0.1"
axum                     = { version = "0.8", features = ["macros", "http2"] }
bitcode                  = { version = "0.6", features = ["serde"] }
bitflags                 = { version = "2", features = ["serde"] }
bstr                     = "1"
bytecount                = { version = "0.6" }
bytes                    = "1"
clap                     = { version = "4", features = ["derive"] }
clap_complete            = "4"
clearscreen              = "4"
console_error_panic_hook = "0.1"
const_format             = { version = "0.2", features = ["fmt"] }
criterion                = { version = "0.8", features = ["html_reports"] }
daft                     = { version = "0.1", features = ["derive"] }
dashmap                  = "6"
derive_more              = { version = "2", features = ["full"] }
futures-util             = "0.3"
getrandom                = { version = "0.3", features = ["wasm_js"] }
hashbrown                = "0.17"
html_parser              = "0.7"
http                     = "1"
indicatif                = "0.18"
insta                    = { version = "1", features = ["ron"] }
itertools                = "0.15"
jiff                     = { version = "0.2", features = ["logging"] }
js-sys                   = "0.3"
libc                     = "0.2"
lightningcss             = { version = "1.0.0-alpha.72", features = ["visitor", "into_owned"] }
markdown                 = { version = "1", features = [] }
memchr                   = "2"
miette                   = { version = "7", default-features = false, features = ["serde", "derive"] }
notify                   = "8"
num-bigint               = "0.5"
num-traits               = "0.2"
num_cpus                 = "1"
ordered-float            = "5"
owo-colors               = "4"
oxc                      = { version = "0.156", default-features = false }
oxc_allocator            = { version = "0.156", default-features = false }
oxc_data_structures      = { version = "0.156", features = ["stack"] }
oxc_ecmascript           = { version = "0.156", default-features = false, features = ["constant_evaluation"] }
oxc_span                 = { version = "0.156", default-features = false }
oxc_traverse             = { version = "0.156", default-features = false }
percent-encoding         = "2"
phf                      = { version = "0.14", features = ["macros"] }
proc-macro2              = { version = "1", default-features = false }
quote                    = { version = "1", default-features = false }
rangemap                 = "1"
rayon                    = "1"
redis                    = { version = "1", features = ["tokio-comp"] }
regex                    = "1"
regress                  = "0.11"
reqwest                  = { version = "0.13", features = ["stream", "query"] }
reqwest-middleware       = { version = "0.5", features = ["query"] }
reqwest-retry            = "0.9"
rmcp                     = "3"
rmp-serde                = "1"
rustc-hash               = "2"
serde                    = { version = "1", features = ["derive", "rc"] }
serde-wasm-bindgen       = "0.6"
serde_json               = { version = "1", features = ["preserve_order"] }
sevenz-rust2             = { version = "0.22", features = ["zstd", "compress"] }
smallvec                 = "1"
smol_str                 = { version = "0.3", features = ["std", "serde"] }
syn                      = { version = "2", default-features = false, features = ["full", "parsing", "printing", "proc-macro"] }
syntect                  = { version = "5", default-features = false }
tempfile                 = "3"
terminal_size            = "0.4"
textwrap                 = "0.16"
thiserror                = "2"
tokio                    = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-stream             = { version = "0.1", default-features = false }
tokio-tungstenite        = "0.30"
tokio-util               = { version = "0.7", default-features = false }
toml                     = "1"
tower-http               = { version = "0.7", features = ["cors"] }
tower-lsp-server         = "0.23"
tracing                  = "0.1"
tracing-subscriber       = { version = "0.3", features = ["env-filter", "time"] }
typesize                 = { version = "0.1", features = ["smol_str"] }
unicode-ident            = "1"
unicode-width            = "0.2"
url                      = "2"
wasm-bindgen             = "0.2"
wasm-bindgen-futures     = "0.4"
web-sys                  = "0.3"
xxhash-rust              = { version = "0.8", features = ["xxh64"] }
zstd                     = "0.13"

# workspace deps
ast_parser           = { path = "crates/ast_parser" }
dagre                = { path = "crates/dagre", features = ["serde"] }
discord_scraper      = { path = "crates/discord_scraper" }
explorer_server_core = { path = "crates/explorer_server_core" }
explorer_types       = { path = "crates/explorer_types" }
git_hash             = { path = "crates/git_hash" }
intl_hash            = { path = "crates/intl_hash" }
macros               = { path = "crates/macros" }
miette_ctx           = { path = "crates/miette_ctx" }
miette_ui            = { path = "crates/miette_ui", default-features = false }
parser_diag          = { path = "crates/parser_diag" }
patch_engine         = { path = "crates/patch_engine" }
pretty_printer       = { path = "crates/pretty_printer" }
reporter             = { path = "crates/reporter" }
term_progress        = { path = "crates/term_progress" }
text_diff            = { path = "crates/text_diff" }
vencord_ast_parser   = { path = "crates/vencord_ast_parser" }
webpack_ast_parser   = { path = "crates/webpack_ast_parser" }
webpack_chunk_parser = { path = "crates/webpack_chunk_parser" }

[patch.crates-io]
typesize = { git = "https://github.com/sadan4/typesize", branch = "feat/smolstr" }


[profile.release]
codegen-units   = 1
debug           = true
incremental     = true
lto             = "thin"
opt-level       = 3
panic           = "abort"
split-debuginfo = "packed"
strip           = true

[profile.dev]
debug       = true
incremental = true
opt-level   = 0

[profile.bench]
codegen-units   = 1
debug           = true
incremental     = true
lto             = "thin"
opt-level       = 3
split-debuginfo = "off"
strip           = false

# reporter does a lot of string chunching
[profile.dev.package.regex]
opt-level = 3

[profile.dev.package.regress]
opt-level = 3

[profile.dev.package.memchr]
opt-level = 3

# https://docs.rs/insta/latest/insta/#optional-faster-runs
[profile.dev.package.insta]
opt-level = 3

# During testing, we parse large javascript files, up to 20mb!
# Compile oxc with -O3 so the tests run 2-4x faster
[profile.test.package.oxc_allocator]
opt-level = 3
[profile.test.package.oxc_span]
opt-level = 3

[profile.dev.package.text_diff]
opt-level = 3

[workspace.lints.cargo]
non_kebab_case_bins = "allow"

[workspace.lints.clippy]
nursery  = { priority = -1, level = "warn" }
pedantic = { priority = -1, level = "warn" }
#TODO: add safety docs later
missing_safety_doc         = "deny"
undocumented_unsafe_blocks = "deny"
# pedantic
# i'd love to be able to get docs on everything, but it doesn't matter that much
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# too noisy
cast_possible_truncation = "allow"
cast_ptr_alignment       = "allow"
cast_sign_loss           = "allow"
# only good to browse
must_use_candidate = "allow"
# bad
items_after_statements = "allow"
# bad and errors sometimes
option_if_let_else = "allow"
# panic has a different error message / connotation compared to assert
manual_assert = "allow"
# no different than div/0
unchecked_time_subtraction = "allow"


# Nursery
debug_assert_with_mut_call = "deny"
# too damn noisy
cast_possible_wrap  = "allow"
cast_precision_loss = "allow"
# it doesnt take types into account, so two names
# with different types will still trigger the lint
similar_names = "allow"
# love to enable this, however it is very broken rust-lang/rust-clippy#11279
significant_drop_tightening = "allow"
# completely broken
# https://github.com/rust-lang/rust-clippy/issues/8539
iter_with_drain              = "allow"
too_long_first_doc_paragraph = "allow"
#restriction
# allow_attributes = "warn"
# love to set this up, but no auto-fixes
# arbitrary_source_item_ordering = "warn"
# bugged and runs after macros are expanded
cognitive_complexity                = "allow"
create_dir                          = "warn"
decimal_literal_representation      = "warn"
deprecated_attributes_without_since = "allow"
disallowed_methods                  = "deny"
filetype_is_file                    = "warn"
fn_to_numeric_cast_any              = "warn"
multiple_inherent_impl              = "warn"
precedence_bits                     = "warn"
semicolon_outside_block             = "warn"
