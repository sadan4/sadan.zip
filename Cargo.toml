[workspace]
package.edition = "2024"
members = ["crates/*"]
resolver = "3"

[workspace.metadata.cargo-shear]
# oxc_span is only pulled in for its "serialize" feature, which adds
# `Serialize` impls to `oxc::span::Span` (re-exported by `oxc`). It's
# never imported by name, so cargo-shear can't see the usage.
ignored = ["oxc_span"]

[workspace.dependencies]
wasm-bindgen = "0.2.113"
serde-wasm-bindgen = "0.6.5"
anyhow = "1.0.102"
serde = { version = "1.0.228", features = ["derive"] }
console_error_panic_hook = "0.1.7"
web-sys = "0.3.4"
js-sys = "0.3.91"
zstd = "0.13.3"
tar = "0.4.44"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread"] }
tokio-stream = { version = "0.1.18", default-features = false }
tokio-util = { version = "0.7.18", default-features = false }
reqwest = { version = "0.13.2", features = ["stream", "query"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
rmp-serde = "1.3.1"
serde_json = { version = "1.0.149", features = ["preserve_order"] }
toml = "1.1.4"
axum = { version = "0.8.8", features = ["macros", "http2"] }
http = "1.4.0"
wasm-bindgen-futures = "0.4.64"
thiserror = "2.0.18"
const_format = { version = "0.2.35", features = ["fmt"] }
tower-http = { version = "0.7.0", features = ["cors"] }
html_parser = "0.7.0"
clap = { version = "4.6.0", features = ["derive"] }
clap_complete = "4.6.0"
itertools = "0.15.0"
xxhash-rust = { version = "0.8.15", features = ["xxh64"] }
oxc = { version = "0.143.0", default-features = false }
oxc_span = { version = "0.143.0", default-features = false }
oxc_traverse = { version = "0.143.0", default-features = false }
oxc_ecmascript = { version = "0.143.0", default-features = false, features = [
  "constant_evaluation",
] }
oxc_allocator = { version = "0.143.0", default-features = false }
oxc-miette = { version = "3.0.0", default-features = false, features = [
  "serde",
] }
regress = "0.11.1"
derive_more = { version = "2.1.1", features = ["full"] }
indicatif = "0.18.4"
insta = { version = "1.47.1", features = ["ron"] }
bitflags = { version = "2.11.0", features = ["serde"] }
owo-colors = "4.3.0"
unicode-width = "0.2.2"
textwrap = "0.16.2"
landlock = "0.4.7"
terminal_size = "0.4.4"
syntect = { version = "5.3.0", default-features = false }
memchr = "2.8.0"
num-bigint = "0.5.1"
regex = "1.12.3"
smol_str = { version = "0.3.6", features = ["std", "serde"] }
proc-macro2 = { version = "1.0.32", default-features = false }
quote = { version = "1.0", default-features = false }
syn = { version = "2.0", default-features = false, features = [
  "full",
  "parsing",
  "printing",
  "proc-macro",
] }
reqwest-retry = "0.9.1"
reqwest-middleware = { version = "0.5.1", features = ["query"] }
bytes = "1.11.1"
macros = { path = "crates/macros" }
explorer_types = { path = "crates/explorer_types" }
explorer_server_core = { path = "crates/explorer_server_core" }
ast_parser = { path = "crates/ast_parser" }
vencord_ast_parser = { path = "crates/vencord_ast_parser" }
webpack_ast_parser = { path = "crates/webpack_ast_parser" }
webpack_chunk_parser = { path = "crates/webpack_chunk_parser" }
pretty_printer = { path = "crates/pretty_printer" }
dagre = { path = "crates/dagre", features = ["serde"] }
discord_scraper = { path = "crates/discord_scraper" }
miette_ctx = { path = "crates/miette_ctx" }
git_hash = { path = "crates/git_hash" }
bot_config = { path = "crates/bot_config" }
reporter = { path = "crates/reporter" }
qalc = { path = "crates/qalc" }
qalc_sbox = { path = "crates/qalc_sbox" }
demangler = { path = "crates/demangler" }
tower-lsp = "0.20.0"
tokio-tungstenite = "0.30.0"
futures-util = "0.3.31"
dashmap = "6.1.0"
tempfile = "3.27.0"
notify = "8.2.0"
rustc-hash = "2.1.2"
clearscreen = "4.0.6"
bitcode = { version = "0.6.9", features = ["serde"] }
markdown = { version = "1.0.0", features = [] }
criterion = { version = "0.8.2", features = ["html_reports"] }
bytecount = { version = "0.6.9" }
rayon = "1.12.0"
num_cpus = "1.17.0"
arrayvec = "0.7.8"
jiff = { version = "0.2.31", features = ["logging"] }
daft = { version = "0.1.7", features = ["derive"] }
smallvec = "1.15.2"
rangemap = "1.7.1"
hashbrown = "0.17.1"
bstr = "1.12.3"
serenity = { git = "https://github.com/serenity-rs/serenity", default-features = false, branch = "next" }
futures-core = "0.3.31"
shlex = "1.3.0"
schemars = "1.2.1"
git2 = { version = "0.21.0", features = ["https", "ssh"] }
unicode-ident = "1.0.24"
cxx = "1.0"
cxx-build = "1.0"
zxcvbn = { version = "3.1.1", features = ["ser"] }
sha1 = "0.11.0"
typesize = "0.1.15"
libc = "0.2.189"
seccompiler = "0.5"
swift-demangler = "0.1.1"
skia-safe = { version = "0.99.0", features = ["webp-decode", "webp-encode"] }
gif = "0.14.2"
webp = { version = "0.3.1", default-features = false }
mini-moka = "0.10"
url = "2.5.8"
ipc-channel = { version = "0.22.0", features = ["async"] }
nix = "0.31.3"
pyo3 = { version = "0.29.2" }
pyo3-stub-gen = { version = "0.23", default-features = false }
pyo3-tracing-subscriber = { version = "0.9.0" }
pyo3-tracing-subscriber-build = { version = "0.9.0" }
oneshot = { version = "0.2.1", features = ["async", "std"] }

[patch.crates-io]
typesize = { git = "https://github.com/GnomedDev/typesize", branch = "master" }


[profile.release]
codegen-units = 1
incremental = true
lto = "thin"
opt-level = 3
debug = true
split-debuginfo = "packed"
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
incremental = true
debug = true

[profile.bench]
codegen-units = 1
incremental = true
lto = "thin"
opt-level = 3
debug = true
split-debuginfo = "off"
strip = false

# reporter does a lot of string chunching
[profile.dev.package.regex]
opt-level = 3

[profile.dev.package.regress]
opt-level = 3

[profile.dev.package.memchr]
opt-level = 3

# https://docs.rs/insta/latest/insta/#optional-faster-runs
[profile.dev.package.insta]
opt-level = 3

# faster dev builds
[profile.dev.package.'*']
opt-level = 3


# During testing, we parse large javascript files, up to 20mb!
# Compile oxc with -O3 so the tests run 2-4x faster
[profile.test.package.oxc_allocator]
opt-level = 3
[profile.test.package.oxc_span]
opt-level = 3

[workspace.lints.rust]
# too buggy and noisy when used in the editor, but can be uncommented to find unused deps
# unused_crate_dependencies = "deny"
[workspace.lints.clippy]
pedantic = { priority = -1, level = "warn" }
nursery = { priority = -1, level = "warn" }
#TODO: add safety docs later
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
# pedantic
# i'd love to be able to get docs on everything, but it doesn't matter that much
missing_panics_doc = "allow"
missing_errors_doc = "allow"
# too noisy
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_ptr_alignment = "allow"
# only good to browse
must_use_candidate = "allow"
# bad
items_after_statements = "allow"
# bad and errors sometimes
option_if_let_else = "allow"
# panic has a different error message / connotation compared to assert
manual_assert = "allow"
# no different than div/0
unchecked_time_subtraction = "allow"


# Nursery
debug_assert_with_mut_call = "deny"
# too damn noisy
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
# it doesnt take types into account, so two names
# with different types will still trigger the lint
similar_names = "allow"
# love to enable this, however it is very broken rust-lang/rust-clippy#11279
significant_drop_tightening = "allow"
# completely broken
# https://github.com/rust-lang/rust-clippy/issues/8539
iter_with_drain = "allow"
too_long_first_doc_paragraph = "allow"
#restriction
# allow_attributes = "warn"
# love to set this up, but no auto-fixes
# arbitrary_source_item_ordering = "warn"
# bugged and runs after macros are expanded
cognitive_complexity = "allow"
create_dir = "warn"
decimal_literal_representation = "warn"
filetype_is_file = "warn"
fn_to_numeric_cast_any = "warn"
multiple_inherent_impl = "warn"
precedence_bits = "warn"
semicolon_outside_block = "warn"
